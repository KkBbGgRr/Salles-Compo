<!DOCTYPE html><html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma salle de composition</title>
<style>
:root{--ink:#10262b;--muted:#566b70;--bg:#edf2f2;--card:#fff;--line:#d3dedf;--teal:#0a4f5c;--sun:#f3c332}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.times{display:flex;gap:8px;margin:14px 0 0;font-size:.9rem}
.times div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.times b{display:block}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0}
.field{display:flex;align-items:center;background:var(--card);border:2px solid var(--teal);border-radius:14px;padding:0 14px}
.field:focus-within{box-shadow:0 0 0 4px rgba(13,106,122,.22)}
.field svg{flex:none;margin-right:10px}
#q{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:1.1rem;padding:15px 0;color:var(--ink);min-width:0}
#clear{border:0;background:transparent;font-size:1.4rem;color:var(--muted);cursor:pointer;padding:6px;display:none}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92rem;padding:9px 6px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.seg button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:6px 2px 10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty b{color:var(--ink)}
.res{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sun);padding:9px 18px;font-weight:700}
.top span:last-child{font-weight:600}
.room{background:var(--teal);color:#fff;padding:16px 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.room .lab{font-size:.85rem;color:#bfdde1}
.room .big{font-size:2.4rem;font-weight:800;line-height:1.05;letter-spacing:-.015em;margin-top:2px}
.room .old{margin-top:8px;font-size:.88rem;color:#bfdde1}
.place{flex:none;text-align:center;background:#fff;color:var(--ink);border-radius:12px;padding:8px 14px}
.place small{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
.place strong{font-size:1.6rem;line-height:1.1}
.who{padding:14px 18px 16px}
.who .n{font-weight:700;font-size:1.05rem}
.who .m{margin-top:6px;color:var(--muted);font-size:.9rem}
footer{margin-top:26px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.res{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>

      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nom, prénom ou matricule" aria-label="Nom, prénom ou matricule">

  <div id="out"></div>
  <footer>Salles mises à jour selon la nouvelle répartition. En cas de doute, vérifie auprès du service des examens et concours.</footer>

const TIME = {1:"12h00 – 12h45", 2:"13h00 – 13h45"};
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const DB = [];
(function(){
  let cur=null;
  RAW.split("\n").forEach(l=>{
    l=l.trim(); if(!l) return;
    if(l[0]==="@"){const p=l.slice(1).split("|");cur={g:+p[0],s:p[1],o:p[2],pos:+p[3]};return;}
    const [nom,pre,mat]=l.split("|"), key=norm(nom+" "+pre);
    DB.push({nom,pre,mat,g:cur.g,s:cur.s,o:cur.o,pos:cur.pos++,key,ck:key.replace(/ /g,""),mk:mat.replace(/[^A-Za-z0-9]/g,"").toUpperCase(),nk:norm(nom)});
  });
})();
const $q=document.getElementById("q"),$out=document.getElementById("out"),$count=document.getElementById("count"),$clear=document.getElementById("clear");
let group=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function search(raw){
  const q=norm(raw); if(q.length<2) return null;
  const toks=q.split(" "), qm=raw.toUpperCase().replace(/[^A-Z0-9]/g,""), isMat=/\d/.test(raw)&&qm.length>=3;
  const res=DB.filter(r=>{
    if(group&&r.g!==group) return false;
    if(isMat&&r.mk.includes(qm)) return true;
    return toks.every(t=>r.key.includes(t)||r.ck.includes(t));
  });
  res.sort((a,b)=>(a.nk.startsWith(toks[0])?0:1)-(b.nk.startsWith(toks[0])?0:1)||a.nom.localeCompare(b.nom)||a.pre.localeCompare(b.pre));
  return res;
}
function card(r){
  return `<article class="res">
    <div class="top"><span>Groupe ${r.g}</span><span>${TIME[r.g]}</span></div>
    <div class="room">
      <div><div class="lab">Ta salle de composition</div><div class="big">${esc(r.s)}</div><div class="old">Ancienne salle : ${esc(r.o)}</div></div>
      <div class="place"><small>Place</small><strong>${r.pos}</strong></div>
    </div>
    <div class="who"><div class="n">${esc(r.nom)} ${esc(r.pre)}</div><div class="m">Matricule ${esc(r.mat)}</div></div>
  </article>`;
}
function render(){
  const v=$q.value; $clear.style.display=v?"block":"none";
  const res=search(v);
  if(res===null){$count.textContent="";$out.innerHTML=`<div class="empty"><b>Tape ton nom, ton prénom ou ton matricule.</b><br>Exemples : <i>KOUAME</i>, <i>AMINATA</i>, <i>25-07994</i>. Combine nom et prénom pour affiner.</div>`;return;}
  if(!res.length){$count.textContent="0 résultat";$out.innerHTML=`<div class="empty"><b>Aucun étudiant trouvé.</b><br>Vérifie l'orthographe, essaie seulement le nom ou le matricule, ou change de groupe.</div>`;return;}
  const MAX=30;
  $count.textContent=res.length>MAX?`${res.length} résultats · les ${MAX} premiers sont affichés. Ajoute un prénom pour affiner.`:`${res.length} résultat${res.length>1?"s":""}`;
  $out.innerHTML=res.slice(0,MAX).map(card).join("");
}
$q.addEventListener("input",render);
$clear.addEventListener("click",()=>{$q.value="";render();$q.focus();});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{group=+b.dataset.g;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();}));
render();
